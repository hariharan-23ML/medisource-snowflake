<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — MediSource</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo"><span class="dot"></span>MEDISOURCE</a>
  </div>
</header>

<div class="auth-card">
  <h1>Create Account</h1>
  <div id="register-error"></div>
  <form id="register-form">
    <div class="form-field">
      <label>Full Name</label>
      <input type="text" id="r-name" required>
    </div>
    <div class="form-field">
      <label>Email</label>
      <input type="email" id="r-email" required>
    </div>
    <div class="form-field">
      <label>Password (min 6 characters)</label>
      <input type="password" id="r-password" minlength="6" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Create Account</button>
  </form>
  <p class="hint">Already have an account? <a href="login.html" style="color:var(--teal); font-weight:600">Sign in</a></p>
</div>

<script src="js/api.js"></script>
<script>
document.getElementById("register-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById("register-error");
  errorEl.innerHTML = "";
  try {
    const { token, user } = await api("/auth/register", {
      method: "POST",
      body: {
        name: document.getElementById("r-name").value,
        email: document.getElementById("r-email").value,
        password: document.getElementById("r-password").value,
      },
    });
    Session.save(token, user);
    window.location.href = "index.html";
  } catch (err) {
    errorEl.innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`;
  }
});
</script>
</body>
</html>
